<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAGbase Chat</title>
<style>
  :root {
    --bg: #0d1217; --panel: #141a21; --panel-2: #1a212a; --border: #232c37;
    --text: #e4e9ef; --dim: #93a0ae;
    --accent: #c6f24e; --accent-ink: #131a08;
    --radius: 12px;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  html[data-theme="light"] {
    --bg: #ffffff; --panel: #f7f8fb; --panel-2: #eef1f6; --border: #e2e7ee;
    --text: #16202b; --dim: #5f6b7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* the page itself never scrolls: only .msgs does, otherwise a stray 1px
     overflow paints an iframe scrollbar down the side of the customer's page */
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Avenir Next", "Helvetica Neue", "Segoe UI", -apple-system, sans-serif;
    font-size: 15px; line-height: 1.6; display: flex; flex-direction: column;
  }
  button { font-family: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .head {
    display: flex; align-items: center; gap: 10px; padding: 14px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .head-title {
    font-weight: 700; font-size: 15px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .head-sub {
    font-size: 12px; color: var(--dim); margin-left: auto; flex-shrink: 0;
    max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg {
    max-width: 88%; padding: 10px 13px; border-radius: var(--radius);
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user {
    align-self: flex-end; background: var(--panel-2); border: 1px solid var(--border);
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start; background: var(--panel); border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg .c {
    display: inline-flex; min-width: 18px; height: 18px; padding: 0 4px; margin: 0 2px;
    border-radius: 5px; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); font-size: 10.5px; font-weight: 700; font-family: var(--mono);
    vertical-align: baseline;
  }
  .msg strong { font-weight: 700; }
  .srcs { align-self: flex-start; display: flex; flex-wrap: wrap; gap: 4px; }
  .srcs span {
    font-size: 11px; color: var(--dim); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 8px;
  }

  .starters { display: flex; flex-wrap: wrap; gap: 6px; align-self: flex-start; }
  .starter {
    font-size: 12px; color: var(--text); background: transparent;
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 11px;
    text-align: left; line-height: 1.35;
  }
  .starter:hover { border-color: var(--accent); }

  .composer {
    display: flex; gap: 8px; padding: 12px; background: var(--panel);
    border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .composer textarea {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg); color: var(--text); font-family: inherit; font-size: 14px;
    padding: 10px 12px; max-height: 120px; line-height: 1.5;
  }
  .composer textarea:focus { border-color: var(--accent); outline: none; }
  .composer textarea::placeholder { color: var(--dim); }
  .send {
    width: 44px; height: 44px; flex-shrink: 0; border: none; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink); font-size: 17px; font-weight: 800;
  }
  .send:disabled { opacity: 0.5; cursor: not-allowed; }

  .powered {
    text-align: center; font-size: 10.5px; color: var(--dim); opacity: .75;
    padding: 0 0 7px; background: var(--panel); flex-shrink: 0;
  }
  .powered a { color: inherit; }

  .err { align-self: center; color: #e2695a; font-size: 13px; }
  .msgs, .composer textarea { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
  <div class="head">
    <span class="dot"></span>
    <span class="head-title" id="head-title">Ask us anything</span>
    <span class="head-sub" id="head-sub">answers from our docs</span>
  </div>
  <div class="msgs" id="msgs"></div>
  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="Type your question…" aria-label="Message"></textarea>
    <button type="submit" class="send" id="send" aria-label="Send">↑</button>
  </form>
  <div class="powered" id="powered">Powered by <a href="https://github.com/charleslck/rag-base" target="_blank" rel="noopener">RAGbase</a></div>

<script>
"use strict";
const PARAMS = new URLSearchParams(location.search);
const KEY = PARAMS.get("key") || "";
/* language: ?lang=zh|en wins, otherwise follow the visitor's browser */
const LANG = (PARAMS.get("lang") || navigator.language || "en").toLowerCase().startsWith("zh") ? "zh" : "en";

const STR = LANG === "zh" ? {
  title: "有问题尽管问",
  sub: "答案来自我们的文档",
  placeholder: "输入你的问题…",
  greeting: "你好！有什么想了解的尽管问 —— 我会基于我们的文档回答，并标注引用来源。",
  error: "请求失败",
  noResponse: "没有收到回复，请重试。",
} : {
  title: "Ask us anything",
  sub: "answers from our docs",
  placeholder: "Type your question…",
  greeting: "Hi! Ask me anything — I answer from our documentation and cite my sources.",
  error: "Request failed",
  noResponse: "No response received. Please try again.",
};

const msgs = document.getElementById("msgs");
const input = document.getElementById("input");
const headTitle = document.getElementById("head-title");
const headSub = document.getElementById("head-sub");
const powered = document.getElementById("powered");

let opts = {
  theme: "auto", primaryColor: "#c6f24e", title: "", subtitle: "", greeting: "",
  placeholder: "", showSources: true, persistSession: true, starterQuestions: [],
  hideBranding: false,
};
let convId = null;

/* ---------------- rendering helpers ---------------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function md(s) {
  let h = esc(s);
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
  return h;
}
function cite(s) { return md(s).replace(/\[(\d{1,2})\]/g, '<span class="c">[$1]</span>'); }

function add(role, html, sources) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "bot");
  d.innerHTML = html;
  msgs.appendChild(d);
  if (opts.showSources && sources && sources.length) {
    const s = document.createElement("div");
    s.className = "srcs";
    s.innerHTML = sources.map((x) => "<span>[" + x.rank + "] " + esc(x.doc_name) + "</span>").join("");
    msgs.appendChild(s);
  }
  msgs.scrollTop = msgs.scrollHeight;
  return d;
}

/* ---------------- branding ---------------- */
function applyBranding(b) {
  const prefersDark = !window.matchMedia || window.matchMedia("(prefers-color-scheme: dark)").matches;
  const theme = b.theme === "auto" ? (prefersDark ? "dark" : "light") : b.theme;
  document.documentElement.dataset.theme = theme;

  const color = b.primaryColor || "#c6f24e";
  document.documentElement.style.setProperty("--accent", color);
  // keep the launcher/send glyph readable whatever colour the customer picks
  const m = /^#([0-9a-f]{6})$/i.exec(color.length === 4
    ? "#" + color[1] + color[1] + color[2] + color[2] + color[3] + color[3]
    : color);
  let ink = "#ffffff";
  if (m) {
    const n = parseInt(m[1], 16);
    const lum = (0.2126 * ((n >> 16) & 255) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) / 255;
    ink = lum > 0.6 ? "#131a08" : "#ffffff";
  }
  document.documentElement.style.setProperty("--accent-ink", ink);

  headTitle.textContent = b.title || STR.title;
  headSub.textContent = b.subtitle || STR.sub;
  input.placeholder = b.placeholder || STR.placeholder;
  powered.style.display = b.hideBranding ? "none" : "";
}

function renderGreeting() {
  const text = opts.greeting || STR.greeting;
  add("bot", md(text));
  if (opts.starterQuestions.length) {
    const box = document.createElement("div");
    box.className = "starters";
    for (const q of opts.starterQuestions) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "starter";
      b.textContent = q;
      b.addEventListener("click", () => {
        box.remove();
        ask(q);
      });
      box.appendChild(b);
    }
    msgs.appendChild(box);
  }
}

function boot() {
  applyBranding(opts);
  renderGreeting();
}

/* ---------------- config ---------------- */
async function loadConfig() {
  if (!KEY) return;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 1500);
  try {
    const res = await fetch("/api/widget/config?key=" + encodeURIComponent(KEY), { signal: ctrl.signal });
    if (!res.ok) return;
    const data = await res.json();
    const cfg = data.config || {};
    opts = { ...opts, ...(cfg.branding || {}), ...(cfg.behavior || {}) };
    opts.primaryColor = (cfg.branding || {}).primaryColor || opts.primaryColor;
  } catch {
    /* unreachable config endpoint: keep the defaults, the chat still works */
  } finally {
    clearTimeout(timer);
  }
}

/* ---------------- chat ---------------- */
const convKey = "ragbase_widget_conv_" + KEY.slice(0, 10);
let busy = false;

function rememberConv(id) {
  convId = id;
  if (opts.persistSession) {
    try { localStorage.setItem(convKey, id); } catch {}
  }
}

async function ask(text) {
  if (!text || busy) return;
  input.value = "";
  input.style.height = "auto";
  busy = true;
  document.getElementById("send").disabled = true;
  const starters = msgs.querySelector(".starters");
  if (starters) starters.remove();
  add("user", esc(text));

  const bubble = add("bot", '<span class="typing">…</span>');
  const body = bubble;

  try {
    const res = await fetch("/api/widget/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": KEY },
      body: JSON.stringify({ message: text, conversation_id: convId, stream: true }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.detail || ("HTTP " + res.status));
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    let answer = "";
    let started = false;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let cut;
      while ((cut = buf.indexOf("\n\n")) !== -1) {
        const frame = buf.slice(0, cut);
        buf = buf.slice(cut + 2);
        if (!frame.startsWith("data: ")) continue;
        const ev = JSON.parse(frame.slice(6));
        if (ev.delta !== undefined) {
          if (!started) { body.innerHTML = ""; started = true; }
          answer += ev.delta;
          body.innerHTML = cite(answer);
          msgs.scrollTop = msgs.scrollHeight;
        } else if (ev.done) {
          if (ev.conversation_id) rememberConv(ev.conversation_id);
          if (opts.showSources && ev.sources && ev.sources.length) {
            const s = document.createElement("div");
            s.className = "srcs";
            s.innerHTML = ev.sources.map((x) => "<span>[" + x.rank + "] " + esc(x.doc_name) + "</span>").join("");
            msgs.appendChild(s);
            msgs.scrollTop = msgs.scrollHeight;
          }
        }
      }
    }
    if (!started) body.textContent = STR.noResponse;
  } catch (err) {
    body.innerHTML = '<span class="err">' + esc(err.message || STR.error) + "</span>";
  } finally {
    busy = false;
    document.getElementById("send").disabled = false;
    input.focus();
  }
}

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("composer").requestSubmit(); }
});
document.getElementById("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  ask(input.value.trim());
});

/* restore an earlier conversation id only when the customer allows persistence */
function restoreConversation() {
  convId = null;
  if (!opts.persistSession || !KEY) return;
  try { convId = localStorage.getItem(convKey) || null; } catch {}
}

document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
/* paint immediately with the defaults, then repaint once the key's config lands
   (usually well under 100ms; a timeout falls back to those same defaults) */
boot();
loadConfig().then(() => {
  restoreConversation();
  applyBranding(opts);
  if (!msgs.querySelector(".msg.user")) {
    msgs.innerHTML = "";
    renderGreeting();
  }
});
</script>
</body>
</html>
